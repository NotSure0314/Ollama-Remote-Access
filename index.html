<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ollama Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<style>
:root {
  /* Palette: #0F3040 #464858 #A56F63 #D99B7F (Color Hunt), plus derived in-between tones */
  --ground: #0f3040; --side: #0b2530; --raise: #163a4c; --hover: #464858;
  --ink: #f6e9df; --dim: #b9aca7; --line: #2a4b5b;
  --accent: #d99b7f; --on-accent: #0f3040; --good: #d99b7f; --bad: #ff7b72;
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Source Serif 4", Charter, Georgia, "Times New Roman", serif;
  --mono: "Geist Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --ground: #f7ede5; --side: #eddbcf; --raise: #fcf6f1; --hover: #e3cab9;
    --ink: #0f3040; --dim: #4b5962; --line: #d8bdab;
    --accent: #0f3040; --on-accent: #f7ede5; --good: #2d6a4f; --bad: #a3261e;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--ink); font: 16px/1.6 var(--sans); display: flex; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* sidebar */
aside { width: 272px; flex: none; background: var(--side); display: flex; flex-direction: column; padding: 12px; gap: 4px; transition: transform .2s; }
.brand { font-weight: 600; font-size: 17px; padding: 8px 10px 12px; }
.newchat { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 9px 10px; }
.newchat:hover, .chat:hover, .chat.on { background: var(--hover); }
.label { color: var(--dim); font-size: 13px; padding: 16px 10px 6px; }
#list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; margin: 0 -4px; padding: 0 4px; }
.chat { display: flex; align-items: center; border-radius: 8px; }
.chat .open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat .del { background: none; border: 0; color: var(--dim); padding: 8px 10px; display: grid; opacity: 0; font-size: 18px; line-height: 1; }
.chat:hover .del, .chat .del:focus-visible { opacity: 1; }
.chat .del:hover { color: var(--bad); }
.none { color: var(--dim); font-size: 14px; padding: 8px 10px; }
#server-selector { position: relative; width: 100%; }
#server-pill { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: left; cursor: pointer; }
#server-pill:hover { border-color: var(--dim); }
#server-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
body.on #server-pill .dot { background: var(--good); }
.meta { display: flex; flex-direction: column; min-width: 0; flex: 1; }
#server-pill .state { font-size: 12.5px; color: var(--dim); line-height: 1.3; }
#server-pill .addr { font-family: var(--mono); font-size: 13px; font-weight: 500; line-height: 18px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill-arrow { font-size: 16px; color: var(--dim); transition: transform 0.15s ease; flex: none; margin-left: 4px; display: none; }
#server-selector.open .pill-arrow { transform: rotate(180deg); }

/* server menu dropdown */
#server-menu { position: absolute; bottom: calc(100% + 8px); left: 0; right: 0; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 12px 28px rgba(0,0,0,0.35); display: none; flex-direction: column; gap: 2px; z-index: 20; max-height: 280px; overflow-y: auto; }
#server-selector.open #server-menu { display: flex; }
.menu-head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); font-weight: 600; padding: 6px 8px 4px; }
.server-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; text-align: left; background: none; border: 0; width: 100%; color: inherit; }
.server-item:hover { background: var(--hover); }
.server-item.active { background: var(--hover); font-weight: 500; }
.server-item .item-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
.server-item.active .item-dot { background: var(--good); }
.server-item .item-addr { font-family: var(--mono); font-size: 12.5px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.server-item .del-srv { background: none; border: 0; color: var(--dim); padding: 2px 4px; font-size: 14px; line-height: 1; border-radius: 4px; opacity: 0; display: flex; align-items: center; justify-content: center; }
.server-item:hover .del-srv { opacity: 1; }
.server-item .del-srv:hover { color: var(--bad); }
.menu-div { height: 1px; background: var(--line); margin: 4px 0; }
#add-server-btn { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: 0; border-radius: 6px; padding: 7px 8px; color: var(--accent); font-size: 13px; font-weight: 500; text-align: left; cursor: pointer; }
#add-server-btn:hover { background: var(--hover); }

/* main */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 56px; }
.icon { display: none; background: none; border: 0; padding: 10px; border-radius: 8px; }
.icon:hover { background: var(--hover); }
#model { background: transparent; border: 0; border-radius: 8px; padding: 6px 8px; font-weight: 500; max-width: 60vw; }
#model:hover { background: var(--hover); }
#model option { background: var(--raise); }
#scroll { flex: 1; overflow-y: auto; padding: 8px 16px 24px; }
.col { width: 100%; max-width: 720px; margin: 0 auto; }
.msg { margin: 0 0 28px; overflow-wrap: anywhere; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .body { background: var(--hover); border-radius: 16px; padding: 10px 16px; max-width: 85%; white-space: pre-wrap; }
.msg.assistant .body { white-space: pre-wrap; font-family: var(--serif); font-size: 17.5px; line-height: 1.65; max-width: 68ch; text-wrap: pretty; }
.msg.error .body { color: var(--bad); }
.body code { font-family: var(--mono); font-size: .88em; font-weight: 500; background: var(--raise); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-variant-numeric: tabular-nums; }
.body pre { white-space: pre; overflow-x: auto; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
.body pre code { background: none; border: 0; padding: 0; font-size: 13.5px; line-height: 1.55; font-variant-numeric: tabular-nums; }
.wait { color: var(--dim); }
::selection { background: var(--accent); color: var(--on-accent); }
input, textarea { caret-color: var(--accent); }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.ph, .ph-fill { font-size: 20px; line-height: 1; flex: none; }

/* hero: connect + empty */
#hero { display: none; text-align: center; padding: 0 16px 28px; }
#hero h1 { font-family: var(--serif); font-size: clamp(30px, 5vw, 46px); font-weight: 500; letter-spacing: -.02em; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; overflow-wrap: anywhere; }
#hero p { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
#hero p { color: var(--dim); margin: 0 auto 20px; max-width: 460px; }
#connect-card { display: none; max-width: 520px; margin: 0 auto; text-align: left; }
.row { display: flex; gap: 8px; }
#server { flex: 1; min-width: 0; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-family: var(--mono); font-size: 14px; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
#server:focus { border-color: var(--accent); outline: none; }
.btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; padding: 0 20px; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
#err { color: var(--bad); font-size: 14px; min-height: 22px; margin-top: 10px; }
#err.info { color: var(--dim); }

/* composer */
#composer { padding: 0 16px 16px; }
.box { background: var(--raise); border: 1px solid var(--line); border-radius: 20px; padding: 10px 10px 10px 18px; display: flex; align-items: flex-end; gap: 10px; }
.box:focus-within { border-color: var(--dim); }
#input { flex: 1; background: none; border: 0; resize: none; outline: none; max-height: 200px; padding: 8px 0; }
#send { width: 38px; height: 38px; flex: none; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); font-size: 18px; display: grid; place-items: center; }
#send:disabled { opacity: .3; cursor: default; }
.fine { text-align: center; color: var(--dim); font-size: 12.5px; margin-top: 10px; }

/* states */
body[data-state="connect"] #hero, body[data-state="connect"] #connect-card { display: block; }
body[data-state="connect"] #hero .on-empty, body[data-state="connect"] #composer, body[data-state="connect"] #scroll, body[data-state="connect"] #model { display: none; }
body[data-state="empty"] #hero { display: block; }
body[data-state="empty"] #hero .on-connect { display: none; }
body[data-state="empty"] #scroll { display: none; }
body[data-state="empty"] main, body[data-state="connect"] main { justify-content: center; }
body[data-state="empty"] .top, body[data-state="connect"] .top { position: absolute; top: 0; }
body[data-state="empty"] .fine, body[data-state="connect"] .fine { display: none; }
body[data-state="thread"] #hero { display: none; }
body[data-state="empty"] main > .spacer { display: none; }

@media (max-width: 760px) {
  aside { position: fixed; inset: 0 auto 0 0; z-index: 5; transform: translateX(-100%); box-shadow: 0 0 0 100vmax transparent; }
  body.menu aside { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.5); }
  .icon { display: block; }
}
</style>
</head>
<body data-state="connect">
<aside>
  <div class="brand">Ollama Chat</div>
  <button class="newchat" id="new"><i class="ph ph-plus" aria-hidden="true"></i> New chat</button>
  <div class="label">Chats</div>
  <nav id="list" aria-label="Saved chats"></nav>
  <div id="server-selector">
    <div id="server-menu" role="menu" aria-label="Server selection">
      <div class="menu-head">Servers</div>
      <div id="server-list"></div>
      <div class="menu-div"></div>
      <button id="add-server-btn" type="button"><i class="ph ph-plus" aria-hidden="true"></i> Add server</button>
    </div>
    <button id="server-pill" aria-label="Change server" aria-haspopup="true">
      <span class="dot" aria-hidden="true"></span>
      <span class="meta">
        <span class="addr" id="pill-addr">No server</span>
        <span class="state" id="pill-state">Not connected</span>
      </span>
      <i class="ph ph-caret-up pill-arrow" id="pill-arrow" aria-hidden="true"></i>
    </button>
  </div>
</aside>

<main>
  <div class="top">
    <button class="icon" id="menu" aria-label="Open menu"><i class="ph ph-list" aria-hidden="true"></i></button>
    <select id="model" aria-label="Model"></select>
  </div>

  <div id="scroll"><div class="col" id="thread"></div></div>

  <section id="hero">
    <h1 class="on-connect">Connect to your Ollama server</h1>
    <h1 class="on-empty" id="hello"></h1>
    <p class="on-empty" id="hello-sub"></p>
    <div id="connect-card">
      <div class="row">
        <input id="server" type="text" placeholder="https://ollama.internal:11434" aria-label="Ollama server address" autocomplete="off" spellcheck="false">
        <button class="btn" id="connect">Connect</button>
      </div>
      <div id="err" role="status"></div>
    </div>
  </section>

  <form id="composer" class="col">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Message your model" aria-label="Message"></textarea>
      <button id="send" type="submit" aria-label="Send"><i class="ph ph-arrow-up" aria-hidden="true"></i></button>
    </div>
    <div class="fine">Enter to send, Shift+Enter for a new line. Chats are saved in this browser only.</div>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// Servers & server-scoped chats
let servers = store.get("servers", []);
servers = servers.filter((s) => s && s !== "https://ollama.internal:11434");
store.set("servers", servers);

let activeServer = store.get("activeServer", servers[0] || "");
if (activeServer === "https://ollama.internal:11434") {
  activeServer = servers[0] || "";
  store.set("activeServer", activeServer);
}

let serverChats = store.get("server_chats", {});

// Migrate legacy single chats list if present
const legacyChats = store.get("chats", null);
if (legacyChats && Array.isArray(legacyChats) && legacyChats.length) {
  if (activeServer && (!serverChats[activeServer] || !serverChats[activeServer].length)) {
    serverChats[activeServer] = legacyChats;
    store.set("server_chats", serverChats);
  }
}

function getCurChats() {
  if (!activeServer) return [];
  if (!serverChats[activeServer]) serverChats[activeServer] = [];
  return serverChats[activeServer];
}

function saveCurChats(list) {
  if (!activeServer) return;
  serverChats[activeServer] = list;
  store.set("server_chats", serverChats);
}

let activeId = null, connected = false, editing = false, controller = null;
const serverEl = $("server"), modelEl = $("model"), input = $("input"), thread = $("thread"), scroller = $("scroll");
serverEl.value = activeServer || "";

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function md(s) {
  return s.split("```").map((p, i) => i % 2
    ? `<pre><code>${esc(p.replace(/^[\w+-]*\n/, ""))}</code></pre>`
    : esc(p).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")).join("");
}

const cur = () => getCurChats().find((c) => c.id === activeId);

function apiHeaders() {
  const h = { "Content-Type": "application/json" };
  const key = store.get("access_key", "");
  if (key) h["x-access-key"] = key;
  return h;
}

function closeServerMenu() {
  const sel = $("server-selector");
  if (sel) sel.classList.remove("open");
}

function toggleServerMenu(e) {
  if (e) e.stopPropagation();
  if (!servers.length) {
    editing = true;
    closeMenu();
    render();
    serverEl.focus();
    return;
  }
  const sel = $("server-selector");
  sel.classList.toggle("open");
  if (sel.classList.contains("open")) renderServerMenu();
}

document.addEventListener("click", (e) => {
  const sel = $("server-selector");
  if (sel && !sel.contains(e.target)) closeServerMenu();
});

function renderServerMenu() {
  const container = $("server-list");
  if (!container) return;
  container.innerHTML = "";
  for (const srv of servers) {
    const isActive = srv === activeServer;
    const item = document.createElement("button");
    item.type = "button";
    item.className = "server-item" + (isActive ? " active" : "");
    item.innerHTML = `
      <span class="item-dot"></span>
      <span class="item-addr" title="${esc(srv)}">${esc(srv)}</span>
      ${isActive ? '<i class="ph ph-check" style="color:var(--accent);font-size:14px;flex:none;"></i>' : ''}
      <button class="del-srv" type="button" title="Remove server" aria-label="Remove server"><i class="ph ph-trash"></i></button>
    `;
    item.onclick = (e) => {
      if (e.target.closest(".del-srv")) return;
      switchServer(srv);
    };
    item.querySelector(".del-srv").onclick = (e) => removeServer(srv, e);
    container.appendChild(item);
  }
}

function switchServer(srv) {
  if (controller) controller.abort();
  activeServer = srv;
  store.set("activeServer", activeServer);
  serverEl.value = srv;
  activeId = null;
  editing = false;
  closeServerMenu();
  closeMenu();
  render();
  connect(false);
}

function removeServer(srv, e) {
  e.stopPropagation();
  if (!confirm(`Remove server ${srv}?`)) return;
  servers = servers.filter((s) => s !== srv);
  store.set("servers", servers);
  delete serverChats[srv];
  store.set("server_chats", serverChats);
  if (activeServer === srv) {
    if (servers.length) {
      switchServer(servers[0]);
    } else {
      activeServer = "";
      store.set("activeServer", "");
      serverEl.value = "";
      connected = false;
      editing = true;
      closeServerMenu();
      render();
    }
  } else {
    renderServerMenu();
    render();
  }
}

$("add-server-btn").onclick = (e) => {
  e.stopPropagation();
  closeServerMenu();
  closeMenu();
  editing = true;
  serverEl.value = "";
  render();
  serverEl.focus();
};

function render() {
  const showConnect = !connected || editing;
  const c = cur();
  document.body.dataset.state = showConnect ? "connect" : c && c.messages.length ? "thread" : "empty";
  document.body.classList.toggle("on", connected);

  const addr = activeServer || serverEl.value.trim();
  $("pill-addr").textContent = activeServer ? activeServer : "No server";
  $("pill-state").textContent = connected ? "Connected" : (activeServer ? "Not connected" : "No server selected");
  $("server-pill").title = servers.length ? "Switch or add server" : "Enter a server address";
  
  const arrow = $("pill-arrow");
  if (arrow) arrow.style.display = servers.length ? "inline-block" : "none";

  $("hello").textContent = modelEl.value || "";
  const n = modelEl.options.length;
  $("hello-sub").textContent = connected ? `${addr} · ${n} model${n === 1 ? "" : "s"} installed` : "";

  // Render chat list for current activeServer
  const list = $("list");
  list.innerHTML = "";
  const chats = getCurChats();
  if (!chats.length) list.innerHTML = '<div class="none">No chats yet</div>';
  for (const ch of chats) {
    const row = document.createElement("div");
    row.className = "chat" + (ch.id === activeId ? " on" : "");
    row.innerHTML = '<button class="open"></button><button class="del" aria-label="Delete chat"><i class="ph ph-trash" aria-hidden="true"></i></button>';
    row.querySelector(".open").title = ch.title;
    row.querySelector(".open").textContent = ch.title;
    row.querySelector(".open").onclick = () => { activeId = ch.id; editing = false; closeMenu(); render(); scroller.scrollTop = scroller.scrollHeight; };
    row.querySelector(".del").onclick = (e) => {
      e.stopPropagation();
      if (!confirm("Delete this chat?")) return;
      const updated = getCurChats().filter((x) => x.id !== ch.id);
      saveCurChats(updated);
      if (activeId === ch.id) activeId = null;
      render();
    };
    list.appendChild(row);
  }

  thread.innerHTML = "";
  for (const m of c ? c.messages : []) addMsg(m.role, m.content);
  scroller.scrollTop = scroller.scrollHeight;
}

function addMsg(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  const body = document.createElement("div");
  body.className = "body";
  if (role === "assistant") body.innerHTML = md(text); else body.textContent = text;
  el.appendChild(body);
  thread.appendChild(el);
  return body;
}

function closeMenu() { document.body.classList.remove("menu"); closeServerMenu(); }
$("menu").onclick = () => document.body.classList.toggle("menu");
$("new").onclick = () => { activeId = null; editing = false; closeMenu(); render(); input.focus(); };
$("server-pill").onclick = toggleServerMenu;

async function connect(silent) {
  const server = serverEl.value.trim();
  const err = $("err");
  if (!server) { err.className = ""; err.textContent = "Enter a server address."; return; }
  err.className = "info"; err.textContent = "Connecting…";
  $("connect").disabled = true;
  try {
    const r = await fetch("/api/tags", { method: "POST", headers: apiHeaders(), body: JSON.stringify({ server }) });
    if (r.status === 401) {
      const pass = prompt("Private instance. Please enter your access password:");
      if (pass) {
        store.set("access_key", pass.trim());
        return connect(silent);
      }
    }
    let data;
    try {
      data = await r.json();
    } catch {
      const text = await r.text().catch(() => "");
      throw new Error(text || `Proxy error (HTTP ${r.status}).`);
    }
    if (!r.ok) throw new Error(data.error || `Connection failed (HTTP ${r.status}).`);
    const names = (data.models || []).map((m) => m.name);
    if (!names.length) throw new Error("Connected, but no models are installed. Run: ollama pull llama3.2");
    const keep = store.get("model_" + server, "");
    modelEl.innerHTML = "";
    for (const n of names) modelEl.add(new Option(n, n));
    modelEl.value = names.includes(keep) ? keep : names[0];
    connected = true;
    editing = false;
    activeServer = server;
    if (!servers.includes(server)) {
      servers.push(server);
      store.set("servers", servers);
    }
    store.set("activeServer", activeServer);
    err.textContent = "";
    render();
    input.focus();
  } catch (e) {
    connected = false;
    err.className = ""; err.textContent = silent ? "" : e.message + (/pull/.test(e.message) ? "" : " Check the address, that Ollama is running, and that it listens on the network.");
    render();
  } finally { $("connect").disabled = false; }
}
$("connect").onclick = () => connect(false);
serverEl.onkeydown = (e) => { if (e.key === "Enter") connect(false); };
modelEl.onchange = () => { if (activeServer) store.set("model_" + activeServer, modelEl.value); render(); };

const UP_ICON = `<i class="ph ph-arrow-up" aria-hidden="true"></i>`;
function setBusy(on) {
  const b = $("send");
  b.innerHTML = on ? '<i class="ph-fill ph-stop" aria-hidden="true"></i>' : UP_ICON;
  b.setAttribute("aria-label", on ? "Stop" : "Send");
}

async function send(text) {
  if (!activeServer) return;
  let chats = getCurChats();
  let c = cur();
  if (!c) {
    c = { id: String(Date.now()), title: text.slice(0, 48), messages: [] };
    chats.unshift(c);
    activeId = c.id;
  }
  c.messages.push({ role: "user", content: text });
  saveCurChats(chats);
  render();
  const body = addMsg("assistant", "");
  body.innerHTML = '<span class="wait">Thinking…</span>';
  scroller.scrollTop = scroller.scrollHeight;

  let reply = "";
  controller = new AbortController();
  setBusy(true);
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: apiHeaders(), signal: controller.signal,
      body: JSON.stringify({ server: activeServer, model: modelEl.value, messages: c.messages }),
    });
    if (!r.ok) {
      if (r.status === 401) {
        const pass = prompt("Private instance. Please enter your access password:");
        if (pass) {
          store.set("access_key", pass.trim());
          c.messages.pop();
          saveCurChats(chats);
          render();
          return send(text);
        }
      }
      let errText = `Request failed (${r.status}).`;
      try {
        const d = await r.json();
        if (d && d.error) errText = d.error;
      } catch {
        const t = await r.text().catch(() => "");
        if (t) errText = t;
      }
      throw new Error(errText);
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const part = JSON.parse(line);
        if (part.error) throw new Error(part.error);
        reply += part.message?.content || "";
        body.innerHTML = md(reply) || '<span class="wait">Thinking…</span>';
      }
      scroller.scrollTop = scroller.scrollHeight;
    }
    c.messages.push({ role: "assistant", content: reply });
    saveCurChats(chats);
  } catch (e) {
    if (e.name === "AbortError") {
      if (reply) {
        c.messages.push({ role: "assistant", content: reply });
        saveCurChats(chats);
      }
    } else {
      c.messages.pop();
      saveCurChats(chats);
      body.parentElement.className = "msg error";
      body.textContent = e.message + " Check that the server is still reachable, then send again.";
      controller = null;
      setBusy(false);
      return;
    }
  }
  controller = null;
  setBusy(false);
  render();
  input.focus();
}

$("composer").onsubmit = (e) => {
  e.preventDefault();
  if (controller) { controller.abort(); return; }
  const t = input.value.trim();
  if (!t || !connected) return;
  input.value = ""; input.style.height = "auto";
  send(t);
};
input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } };
input.oninput = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; };

render();
if (activeServer) {
  serverEl.value = activeServer;
  connect(true);
}
</script>
</body>
</html>
