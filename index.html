<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ollama Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<style>
:root {
  /* Palette: #0F3040 #464858 #A56F63 #D99B7F (Color Hunt), plus derived in-between tones */
  --ground: #0f3040; --side: #0b2530; --raise: #163a4c; --hover: #464858;
  --ink: #f6e9df; --dim: #b9aca7; --line: #2a4b5b;
  --accent: #d99b7f; --on-accent: #0f3040; --good: #d99b7f; --bad: #ff7b72;
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Source Serif 4", Charter, Georgia, "Times New Roman", serif;
  --mono: "Geist Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --ground: #f7ede5; --side: #eddbcf; --raise: #fcf6f1; --hover: #e3cab9;
    --ink: #0f3040; --dim: #4b5962; --line: #d8bdab;
    --accent: #0f3040; --on-accent: #f7ede5; --good: #2d6a4f; --bad: #a3261e;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--ink); font: 16px/1.6 var(--sans); display: flex; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* sidebar */
aside { width: 272px; flex: none; background: var(--side); display: flex; flex-direction: column; padding: 12px; gap: 4px; transition: transform .2s; }
.brand { font-weight: 600; font-size: 17px; padding: 8px 10px 12px; }
.newchat { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 9px 10px; }
.newchat:hover, .chat:hover, .chat.on { background: var(--hover); }
.label { color: var(--dim); font-size: 13px; padding: 16px 10px 6px; }
#list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; margin: 0 -4px; padding: 0 4px; }
.chat { display: flex; align-items: center; border-radius: 8px; }
.chat .open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat .del { background: none; border: 0; color: var(--dim); padding: 8px 10px; display: grid; opacity: 0; font-size: 18px; line-height: 1; }
.chat:hover .del, .chat .del:focus-visible { opacity: 1; }
.chat .del:hover { color: var(--bad); }
.none { color: var(--dim); font-size: 14px; padding: 8px 10px; }
#server-selector { position: relative; width: 100%; }
#server-pill { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: left; cursor: pointer; }
#server-pill:hover { border-color: var(--dim); }
#server-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
body.on #server-pill .dot { background: var(--good); }
.meta { display: flex; flex-direction: column; min-width: 0; flex: 1; }
#server-pill .state { font-size: 12.5px; color: var(--dim); line-height: 1.3; }
#server-pill .addr { font-family: var(--mono); font-size: 13px; font-weight: 500; line-height: 18px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill-arrow { font-size: 16px; color: var(--dim); transition: transform 0.15s ease; flex: none; margin-left: 4px; display: none; }
#server-selector.open .pill-arrow { transform: rotate(180deg); }

/* server menu dropdown */
#server-menu { position: absolute; bottom: calc(100% + 8px); left: 0; right: 0; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 12px 28px rgba(0,0,0,0.35); display: none; flex-direction: column; gap: 2px; z-index: 20; max-height: 280px; overflow-y: auto; }
#server-selector.open #server-menu { display: flex; }
.menu-head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); font-weight: 600; padding: 6px 8px 4px; }
.server-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; text-align: left; background: none; border: 0; width: 100%; color: inherit; }
.server-item:hover { background: var(--hover); }
.server-item.active { background: var(--hover); font-weight: 500; }
.server-item .item-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
.server-item.active .item-dot { background: var(--good); }
.server-item .item-addr { font-family: var(--mono); font-size: 12.5px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.server-item .del-srv { background: none; border: 0; color: var(--dim); padding: 2px 4px; font-size: 14px; line-height: 1; border-radius: 4px; opacity: 0; display: flex; align-items: center; justify-content: center; }
.server-item:hover .del-srv { opacity: 1; }
.server-item .del-srv:hover { color: var(--bad); }
.menu-div { height: 1px; background: var(--line); margin: 4px 0; }
#add-server-btn { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: 0; border-radius: 6px; padding: 7px 8px; color: var(--accent); font-size: 13px; font-weight: 500; text-align: left; cursor: pointer; }
#add-server-btn:hover { background: var(--hover); }

/* main */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 56px; }
.icon { display: none; background: none; border: 0; padding: 10px; border-radius: 8px; }
.icon:hover { background: var(--hover); }
#model { background: transparent; border: 0; border-radius: 8px; padding: 6px 8px; font-weight: 500; max-width: 60vw; }
#model:hover { background: var(--hover); }
#model option { background: var(--raise); }
#scroll { flex: 1; overflow-y: auto; padding: 8px 16px 24px; }
.col { width: 100%; max-width: 720px; margin: 0 auto; }
.msg { margin: 0 0 28px; overflow-wrap: anywhere; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .body { background: var(--hover); border-radius: 16px; padding: 10px 16px; max-width: 85%; white-space: pre-wrap; }
.msg.assistant .body { white-space: pre-wrap; font-family: var(--serif); font-size: 17.5px; line-height: 1.65; max-width: 68ch; text-wrap: pretty; }
.msg.error .body { color: var(--bad); }
.body code { font-family: var(--mono); font-size: .88em; font-weight: 500; background: var(--raise); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-variant-numeric: tabular-nums; }
.body pre { white-space: pre; overflow-x: auto; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
.body pre code { background: none; border: 0; padding: 0; font-size: 13.5px; line-height: 1.55; font-variant-numeric: tabular-nums; }
.wait { color: var(--dim); }
::selection { background: var(--accent); color: var(--on-accent); }
input, textarea { caret-color: var(--accent); }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.ph, .ph-fill { font-size: 20px; line-height: 1; flex: none; }

/* hero: connect + empty */
#hero { display: none; text-align: center; padding: 0 16px 28px; }
#hero h1 { font-family: var(--serif); font-size: clamp(30px, 5vw, 46px); font-weight: 500; letter-spacing: -.02em; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; overflow-wrap: anywhere; }
#hero p { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
#hero p { color: var(--dim); margin: 0 auto 20px; max-width: 460px; }
#connect-card { display: none; max-width: 520px; margin: 0 auto; text-align: left; }
.row { display: flex; gap: 8px; }
#server { flex: 1; min-width: 0; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-family: var(--mono); font-size: 14px; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
#server:focus { border-color: var(--accent); outline: none; }
.btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; padding: 0 20px; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
#err { color: var(--bad); font-size: 14px; min-height: 22px; margin-top: 10px; }
#err.info { color: var(--dim); }

/* composer */
#composer { padding: 0 16px 16px; }
.box { 
  background: var(--raise); 
  border: 1px solid var(--line); 
  border-radius: 18px; 
  padding: 12px 14px 10px 16px; 
  display: flex; 
  flex-direction: column; 
  gap: 8px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.box:focus-within { 
  border-color: var(--dim); 
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
}
#input { 
  width: 100%; 
  background: none; 
  border: 0; 
  resize: none; 
  outline: none; 
  max-height: 200px; 
  padding: 2px 0 6px 0; 
  font-family: inherit;
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
}
.box-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 12px;
}
.box-bottom-left {
  display: flex;
  align-items: center;
  gap: 6px;
}
.composer-action-btn {
  background: none;
  border: 0;
  color: var(--dim);
  font-size: 17px;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  transition: background .12s, color .12s;
}
.composer-action-btn:hover {
  background: var(--hover);
  color: var(--ink);
}
.composer-pill {
  font-size: 12px;
  font-weight: 500;
  color: var(--dim);
  background: var(--hover);
  padding: 3px 9px;
  border-radius: 6px;
  border: 1px solid var(--line);
  user-select: none;
}
.box-bottom-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.model-picker {
  position: relative;
  display: inline-flex;
  align-items: center;
  background: transparent;
  border-radius: 8px;
  padding: 2px 4px;
  transition: background .15s ease;
  cursor: pointer;
}
.model-picker:hover {
  background: var(--hover);
}
.model-picker select {
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  border: none;
  outline: none;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--dim);
  cursor: pointer;
  padding: 4px 22px 4px 8px;
  max-width: 220px;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  transition: color .15s ease;
}
.model-picker select:hover, .model-picker:hover select {
  color: var(--ink);
}
.model-picker option {
  background: var(--raise);
  color: var(--ink);
  font-family: var(--sans);
}
.model-caret {
  position: absolute;
  right: 6px;
  pointer-events: none;
  font-size: 13px !important;
  color: var(--dim);
  display: flex;
  align-items: center;
}
.model-picker:hover .model-caret {
  color: var(--ink);
}
#send { 
  width: 32px; 
  height: 32px; 
  flex: none; 
  border-radius: 50%; 
  border: 0; 
  background: var(--accent); 
  color: var(--on-accent); 
  font-size: 16px; 
  display: grid; 
  place-items: center; 
  cursor: pointer;
  transition: opacity .15s ease, transform .1s ease;
}
#send:active {
  transform: scale(0.95);
}
#send:disabled { 
  opacity: .3; 
  cursor: default; 
}
.fine { text-align: center; color: var(--dim); font-size: 12.5px; margin-top: 10px; }

/* attachments */
.attachments-shelf { display: none; flex-wrap: wrap; gap: 8px; padding: 0 0 8px 0; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.attachments-shelf.has-files { display: flex; }
.attach-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--side); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 12px; color: var(--ink); max-width: 240px; }
.attach-chip img.thumb { width: 22px; height: 22px; object-fit: cover; border-radius: 4px; flex: none; }
.attach-chip .fname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.attach-chip .fsize { color: var(--dim); font-size: 10.5px; flex: none; }
.attach-chip .remove-btn { background: none; border: 0; color: var(--dim); cursor: pointer; padding: 0; font-size: 14px; line-height: 1; display: flex; align-items: center; }
.attach-chip .remove-btn:hover { color: var(--bad); }
.msg-attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.msg-img-thumb { max-width: 260px; max-height: 200px; border-radius: 8px; border: 1px solid var(--line); object-fit: cover; }
#composer.dragover .box { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

/* states */
body[data-state="connect"] #hero, body[data-state="connect"] #connect-card { display: block; }
body[data-state="connect"] #hero .on-empty, body[data-state="connect"] #composer, body[data-state="connect"] #scroll, body[data-state="connect"] #model { display: none; }
body[data-state="empty"] #hero { display: block; }
body[data-state="empty"] #hero .on-connect { display: none; }
body[data-state="empty"] #scroll { display: none; }
body[data-state="empty"] main, body[data-state="connect"] main { justify-content: center; }
body[data-state="empty"] .top, body[data-state="connect"] .top { position: absolute; top: 0; }
body[data-state="empty"] .fine, body[data-state="connect"] .fine { display: none; }
body[data-state="thread"] #hero { display: none; }
body[data-state="empty"] main > .spacer { display: none; }

@media (max-width: 760px) {
  aside { position: fixed; inset: 0 auto 0 0; z-index: 5; transform: translateX(-100%); box-shadow: 0 0 0 100vmax transparent; }
  body.menu aside { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.5); }
  .icon { display: block; }
}
</style>
</head>
<body data-state="connect">
<aside>
  <div class="brand">Ollama Chat</div>
  <button class="newchat" id="new"><i class="ph ph-plus" aria-hidden="true"></i> New chat</button>
  <div class="label">Chats</div>
  <nav id="list" aria-label="Saved chats"></nav>
  <div id="server-selector">
    <div id="server-menu" role="menu" aria-label="Server selection">
      <div class="menu-head">Servers</div>
      <div id="server-list"></div>
      <div class="menu-div"></div>
      <button id="add-server-btn" type="button"><i class="ph ph-plus" aria-hidden="true"></i> Add server</button>
    </div>
    <button id="server-pill" aria-label="Change server" aria-haspopup="true">
      <span class="dot" aria-hidden="true"></span>
      <span class="meta">
        <span class="addr" id="pill-addr">No server</span>
        <span class="state" id="pill-state">Not connected</span>
      </span>
      <i class="ph ph-caret-up pill-arrow" id="pill-arrow" aria-hidden="true"></i>
    </button>
  </div>
</aside>

<main>
  <div class="top">
    <button class="icon" id="menu" aria-label="Open menu"><i class="ph ph-list" aria-hidden="true"></i></button>
  </div>

  <div id="scroll"><div class="col" id="thread"></div></div>

  <section id="hero">
    <h1 class="on-connect">Connect to your Ollama server</h1>
    <h1 class="on-empty" id="hello"></h1>
    <p class="on-empty" id="hello-sub"></p>
    <div id="connect-card">
      <div class="row">
        <input id="server" type="text" placeholder="https://ollama.internal:11434" aria-label="Ollama server address" autocomplete="off" spellcheck="false">
        <button class="btn" id="connect">Connect</button>
      </div>
      <div id="err" role="status"></div>
    </div>
  </section>

  <form id="composer" class="col">
    <div class="box">
      <div id="attachments-shelf" class="attachments-shelf"></div>
      <textarea id="input" rows="1" placeholder="Message your model" aria-label="Message"></textarea>
      <div class="box-bottom">
        <div class="box-bottom-left">
          <button type="button" class="composer-action-btn" id="attach-btn" title="Attach file or image" aria-label="Attach file">
            <i class="ph ph-plus" aria-hidden="true"></i>
          </button>
          <input type="file" id="file-input" style="display:none" multiple accept="text/*,image/*,.json,.md,.csv,.py,.js,.ts,.tsx,.jsx,.html,.css,.yaml,.yml,.sh,.sql,.log">
          <span class="composer-pill">Chat</span>
        </div>
        <div class="box-bottom-right">
          <div class="model-picker" id="model-picker" title="Switch model">
            <select id="model" aria-label="Switch model"></select>
            <i class="ph ph-caret-down model-caret" aria-hidden="true"></i>
          </div>
          <button id="send" type="submit" aria-label="Send"><i class="ph ph-arrow-up" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>
    <div class="fine">Enter to send, Shift+Enter for a new line. Chats are saved in this browser only.</div>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// Server normalization: strip protocol, trailing slashes, whitespace
function cleanServer(s) {
  if (!s) return "";
  return String(s).trim().toLowerCase().replace(/^https?:\/\//i, "").replace(/\/+$/, "");
}

// Remove legacy shared chats so they never leak across servers
try { localStorage.removeItem("chats"); } catch {}

// Servers & server-scoped chats
let servers = store.get("servers", []);
servers = servers.filter((s) => s && s !== "https://ollama.internal:11434");
store.set("servers", servers);

let activeServer = store.get("activeServer", servers[0] || "");
if (activeServer === "https://ollama.internal:11434") {
  activeServer = servers[0] || "";
  store.set("activeServer", activeServer);
}

let serverChats = store.get("server_chats", {});
if (typeof serverChats !== "object" || serverChats === null) serverChats = {};

function getCurChats() {
  const k = cleanServer(activeServer);
  if (!k) return [];
  if (!serverChats[k] || !Array.isArray(serverChats[k])) serverChats[k] = [];
  return serverChats[k];
}

function saveCurChats(list) {
  const k = cleanServer(activeServer);
  if (!k) return;
  serverChats[k] = list;
  store.set("server_chats", serverChats);
}

let activeId = null, connected = false, editing = false, controller = null;
const serverEl = $("server"), modelEl = $("model"), input = $("input"), thread = $("thread"), scroller = $("scroll");

// Restore last typed server or active server
const lastTyped = store.get("last_server_typed", "");
serverEl.value = activeServer || lastTyped || "";
serverEl.oninput = () => {
  store.set("last_server_typed", serverEl.value.trim());
};

// Optimistic connected state if activeServer already saved
if (activeServer) {
  const k = cleanServer(activeServer);
  connected = true;
  editing = false;
  activeId = store.get("activeId_" + k, null);
  const cachedModels = store.get("models_" + k, []) || store.get("models_" + activeServer, []);
  const savedModel = store.get("model_" + k, "") || store.get("model_" + activeServer, "");
  if (cachedModels.length) {
    modelEl.innerHTML = "";
    for (const n of cachedModels) modelEl.add(new Option(n, n));
    modelEl.value = cachedModels.includes(savedModel) ? savedModel : cachedModels[0];
  }
} else {
  editing = true;
}

const esc = (s) => String(s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function md(s) {
  return String(s || "").split("```").map((p, i) => i % 2
    ? `<pre><code>${esc(p.replace(/^[\w+-]*\n/, ""))}</code></pre>`
    : esc(p).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")).join("");
}

const cur = () => getCurChats().find((c) => String(c.id) === String(activeId));

function closeServerMenu() {
  const sel = $("server-selector");
  if (sel) sel.classList.remove("open");
}

function toggleServerMenu(e) {
  if (e) e.stopPropagation();
  if (!servers.length) {
    editing = true;
    closeMenu();
    render();
    serverEl.focus();
    return;
  }
  const sel = $("server-selector");
  sel.classList.toggle("open");
  if (sel.classList.contains("open")) renderServerMenu();
}

document.addEventListener("click", (e) => {
  const sel = $("server-selector");
  if (sel && !sel.contains(e.target)) closeServerMenu();
});

function renderServerMenu() {
  const container = $("server-list");
  if (!container) return;
  container.innerHTML = "";
  for (const srv of servers) {
    const isActive = cleanServer(srv) === cleanServer(activeServer);
    const item = document.createElement("button");
    item.type = "button";
    item.className = "server-item" + (isActive ? " active" : "");
    item.innerHTML = `
      <span class="item-dot"></span>
      <span class="item-addr" title="${esc(srv)}">${esc(srv)}</span>
      ${isActive ? '<i class="ph ph-check" style="color:var(--accent);font-size:14px;flex:none;"></i>' : ''}
      <button class="del-srv" type="button" title="Remove server" aria-label="Remove server"><i class="ph ph-trash"></i></button>
    `;
    item.onclick = (e) => {
      if (e.target.closest(".del-srv")) return;
      switchServer(srv);
    };
    item.querySelector(".del-srv").onclick = (e) => removeServer(srv, e);
    container.appendChild(item);
  }
}

function switchServer(srv) {
  if (controller) controller.abort();
  activeServer = srv;
  store.set("activeServer", activeServer);
  store.set("last_server_typed", srv);
  serverEl.value = srv;

  const k = cleanServer(srv);
  const serverSavedId = store.get("activeId_" + k, null);
  const chats = getCurChats();
  if (serverSavedId && chats.some((c) => String(c.id) === String(serverSavedId))) {
    activeId = String(serverSavedId);
  } else {
    activeId = chats.length ? String(chats[0].id) : null;
    store.set("activeId_" + k, activeId);
  }

  attachedFiles = [];
  renderAttachments();
  editing = false;
  connected = true;
  closeServerMenu();
  closeMenu();

  const cachedModels = store.get("models_" + k, []);
  if (cachedModels.length) {
    const keep = store.get("model_" + k, "");
    modelEl.innerHTML = "";
    for (const n of cachedModels) modelEl.add(new Option(n, n));
    modelEl.value = cachedModels.includes(keep) ? keep : cachedModels[0];
  } else {
    modelEl.innerHTML = "";
  }

  render();
  connect(true);
}

function removeServer(srv, e) {
  e.stopPropagation();
  if (!confirm(`Remove server ${srv}?`)) return;
  servers = servers.filter((s) => cleanServer(s) !== cleanServer(srv));
  store.set("servers", servers);

  const k = cleanServer(srv);
  delete serverChats[k];
  delete serverChats[srv];
  store.set("server_chats", serverChats);
  try {
    localStorage.removeItem("activeId_" + k);
    localStorage.removeItem("models_" + k);
    localStorage.removeItem("model_" + k);
  } catch {}

  if (cleanServer(activeServer) === k) {
    if (servers.length) {
      switchServer(servers[0]);
    } else {
      activeServer = "";
      store.set("activeServer", "");
      serverEl.value = "";
      activeId = null;
      connected = false;
      editing = true;
      closeServerMenu();
      render();
    }
  } else {
    renderServerMenu();
    render();
  }
}

$("add-server-btn").onclick = (e) => {
  e.stopPropagation();
  closeServerMenu();
  closeMenu();
  editing = true;
  activeServer = "";
  store.set("activeServer", "");
  activeId = null;
  serverEl.value = "";
  attachedFiles = [];
  renderAttachments();
  render();
  serverEl.focus();
};

/* Attachments & File Handling */
let attachedFiles = [];

function formatBytes(bytes) {
  if (!bytes || bytes <= 0) return "0 B";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

async function handleFiles(fileList) {
  for (const file of fileList) {
    if (file.type.startsWith("image/")) {
      const dataUrl = await new Promise((res) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.readAsDataURL(file);
      });
      const base64 = String(dataUrl).split(",")[1] || "";
      attachedFiles.push({
        name: file.name,
        size: file.size,
        type: "image",
        base64,
        preview: dataUrl,
      });
    } else {
      const text = await new Promise((res) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.readAsText(file);
      });
      attachedFiles.push({
        name: file.name,
        size: file.size,
        type: "text",
        content: text,
      });
    }
  }
  renderAttachments();
}

function renderAttachments() {
  const shelf = $("attachments-shelf");
  if (!shelf) return;
  shelf.innerHTML = "";
  shelf.classList.toggle("has-files", attachedFiles.length > 0);
  attachedFiles.forEach((f, idx) => {
    const chip = document.createElement("div");
    chip.className = "attach-chip";
    const icon = f.type === "image"
      ? `<img src="${f.preview}" class="thumb" alt="">`
      : `<i class="ph ph-file-code" style="font-size:14px;color:var(--accent);"></i>`;
    chip.innerHTML = `
      ${icon}
      <span class="fname" title="${esc(f.name)}">${esc(f.name)}</span>
      <span class="fsize">${formatBytes(f.size)}</span>
      <button type="button" class="remove-btn" title="Remove attachment" aria-label="Remove"><i class="ph ph-x"></i></button>
    `;
    chip.querySelector(".remove-btn").onclick = (e) => {
      e.stopPropagation();
      attachedFiles.splice(idx, 1);
      renderAttachments();
    };
    shelf.appendChild(chip);
  });
}

const attachBtn = $("attach-btn");
const fileInput = $("file-input");
if (attachBtn && fileInput) {
  attachBtn.onclick = (e) => {
    e.preventDefault();
    fileInput.click();
  };
  fileInput.onchange = () => {
    if (fileInput.files && fileInput.files.length) {
      handleFiles(Array.from(fileInput.files));
      fileInput.value = "";
    }
  };
}

input.addEventListener("paste", (e) => {
  if (e.clipboardData && e.clipboardData.files && e.clipboardData.files.length) {
    handleFiles(Array.from(e.clipboardData.files));
  }
});

const compForm = $("composer");
if (compForm) {
  compForm.addEventListener("dragover", (e) => {
    e.preventDefault();
    compForm.classList.add("dragover");
  });
  compForm.addEventListener("dragleave", () => {
    compForm.classList.remove("dragover");
  });
  compForm.addEventListener("drop", (e) => {
    e.preventDefault();
    compForm.classList.remove("dragover");
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      handleFiles(Array.from(e.dataTransfer.files));
    }
  });
}

function render() {
  const showConnect = (!activeServer && !connected) || editing;
  const c = cur();
  document.body.dataset.state = showConnect ? "connect" : c && c.messages && c.messages.length ? "thread" : "empty";
  document.body.classList.toggle("on", connected);

  const addr = activeServer || serverEl.value.trim();
  $("pill-addr").textContent = activeServer ? activeServer : (addr || "No server");
  $("pill-state").textContent = connected ? "Connected" : (activeServer ? "Reconnecting…" : "No server");
  $("server-pill").title = servers.length ? "Switch or add server" : "Enter a server address";

  const arrow = $("pill-arrow");
  if (arrow) arrow.style.display = servers.length ? "inline-block" : "none";

  $("hello").textContent = modelEl.value || "";
  const n = modelEl.options.length;
  $("hello-sub").textContent = connected ? `${addr} · ${n} model${n === 1 ? "" : "s"} installed` : (activeServer ? `${addr} · Connecting…` : "");

  const picker = $("model-picker");
  if (picker) {
    picker.style.display = n ? "inline-flex" : "none";
    picker.title = modelEl.value ? `Current model: ${modelEl.value}` : "Select model";
  }

  // Render chat list strictly for current activeServer
  const list = $("list");
  list.innerHTML = "";
  const chats = getCurChats();
  if (!chats.length) list.innerHTML = '<div class="none">No chats yet</div>';
  for (const ch of chats) {
    const row = document.createElement("div");
    row.className = "chat" + (String(ch.id) === String(activeId) ? " on" : "");
    row.innerHTML = `
      <button class="open" type="button" title="${esc(ch.title)}">${esc(ch.title)}</button>
      <button class="del" type="button" aria-label="Delete chat" title="Delete chat"><i class="ph ph-trash" aria-hidden="true"></i></button>
    `;
    row.onclick = (e) => {
      if (e.target.closest(".del")) return;
      activeId = String(ch.id);
      const k = cleanServer(activeServer);
      if (k) store.set("activeId_" + k, activeId);
      editing = false;
      connected = true;
      closeMenu();
      render();
      scroller.scrollTop = scroller.scrollHeight;
    };
    row.querySelector(".del").onclick = (e) => {
      e.stopPropagation();
      if (!confirm("Delete this chat?")) return;
      const updated = getCurChats().filter((x) => String(x.id) !== String(ch.id));
      saveCurChats(updated);
      if (String(activeId) === String(ch.id)) {
        activeId = updated.length ? String(updated[0].id) : null;
        const k = cleanServer(activeServer);
        if (k) store.set("activeId_" + k, activeId);
      }
      render();
    };
    list.appendChild(row);
  }

  thread.innerHTML = "";
  for (const m of (c && c.messages ? c.messages : [])) {
    addMsg(m.role, m.content, m.images, m.files);
  }
  scroller.scrollTop = scroller.scrollHeight;
}

function addMsg(role, text, images, files) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  const body = document.createElement("div");
  body.className = "body";

  if (role === "user" && ((images && images.length) || (files && files.length))) {
    const attachBar = document.createElement("div");
    attachBar.className = "msg-attachments";
    if (images) {
      for (const img of images) {
        const thumb = document.createElement("img");
        thumb.src = String(img).startsWith("data:") ? img : `data:image/jpeg;base64,${img}`;
        thumb.className = "msg-img-thumb";
        attachBar.appendChild(thumb);
      }
    }
    if (files) {
      for (const f of files) {
        const chip = document.createElement("div");
        chip.className = "attach-chip";
        chip.innerHTML = `<i class="ph ph-file-code" style="color:var(--accent);"></i><span class="fname">${esc(f)}</span>`;
        attachBar.appendChild(chip);
      }
    }
    body.appendChild(attachBar);
  }

  const textDiv = document.createElement("div");
  if (role === "assistant") textDiv.innerHTML = md(text || ""); else textDiv.textContent = text || "";
  body.appendChild(textDiv);
  el.appendChild(body);
  thread.appendChild(el);
  return textDiv;
}

function closeMenu() { document.body.classList.remove("menu"); closeServerMenu(); }
$("menu").onclick = () => document.body.classList.toggle("menu");

function startNewChat() {
  activeId = null;
  const k = cleanServer(activeServer);
  if (k) store.set("activeId_" + k, null);
  editing = false;
  attachedFiles = [];
  renderAttachments();
  closeMenu();
  render();
  input.focus();
}
$("new").onclick = startNewChat;
$("server-pill").onclick = toggleServerMenu;

async function connect(silent) {
  const server = (serverEl.value || activeServer || "").trim();
  const err = $("err");
  if (!server) {
    if (!silent) {
      err.className = "";
      err.textContent = "Enter a server address.";
    }
    return;
  }
  if (!silent) {
    err.className = "info";
    err.textContent = "Connecting…";
    $("connect").disabled = true;
  }
  store.set("last_server_typed", server);
  try {
    const r = await fetch("/api/tags", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ server }) });
    let data;
    try {
      data = await r.json();
    } catch {
      const text = await r.text().catch(() => "");
      throw new Error(text || `Proxy error (HTTP ${r.status}).`);
    }
    if (!r.ok) throw new Error(data.error || `Connection failed (HTTP ${r.status}).`);
    const names = (data.models || []).map((m) => m.name);
    if (!names.length) throw new Error("Connected, but no models are installed. Run: ollama pull llama3.2");

    const k = cleanServer(server);
    store.set("models_" + k, names);
    const keep = store.get("model_" + k, "");
    modelEl.innerHTML = "";
    for (const n of names) modelEl.add(new Option(n, n));
    modelEl.value = names.includes(keep) ? keep : names[0];

    connected = true;
    editing = false;
    activeServer = server;
    if (!servers.some((s) => cleanServer(s) === k)) {
      servers.push(server);
      store.set("servers", servers);
    }
    store.set("activeServer", activeServer);

    // Initialize this server's chat array if non-existent
    if (!serverChats[k] || !Array.isArray(serverChats[k])) {
      serverChats[k] = [];
      store.set("server_chats", serverChats);
    }

    // Restore this server's activeId
    const chats = getCurChats();
    const savedId = store.get("activeId_" + k, null);
    if (savedId && chats.some((c) => String(c.id) === String(savedId))) {
      activeId = String(savedId);
    } else {
      activeId = chats.length ? String(chats[0].id) : null;
      store.set("activeId_" + k, activeId);
    }

    err.textContent = "";
    render();
    if (!silent) input.focus();
  } catch (e) {
    connected = false;
    if (!silent) {
      err.className = "";
      err.textContent = e.message + (/pull/.test(e.message) ? "" : " Check the address, that Ollama is running, and that it listens on the network.");
    }
    render();
  } finally {
    $("connect").disabled = false;
  }
}
$("connect").onclick = () => connect(false);
serverEl.onkeydown = (e) => { if (e.key === "Enter") connect(false); };
modelEl.onchange = () => {
  const k = cleanServer(activeServer);
  if (k) store.set("model_" + k, modelEl.value);
  render();
};

const UP_ICON = `<i class="ph ph-arrow-up" aria-hidden="true"></i>`;
function setBusy(on) {
  const b = $("send");
  b.innerHTML = on ? '<i class="ph-fill ph-stop" aria-hidden="true"></i>' : UP_ICON;
  b.setAttribute("aria-label", on ? "Stop" : "Send");
}

async function send(text) {
  if (!activeServer) return;
  const currentAttachments = [...attachedFiles];
  attachedFiles = [];
  renderAttachments();

  let promptText = text;
  const images = [];
  const fileNames = [];

  for (const f of currentAttachments) {
    if (f.type === "image") {
      images.push(f.base64);
    } else if (f.type === "text") {
      fileNames.push(f.name);
      promptText += `\n\n--- Attachment: ${f.name} ---\n${f.content}\n---`;
    }
  }

  if (!promptText.trim() && !images.length) return;

  const k = cleanServer(activeServer);
  let chats = getCurChats();
  let c = cur();
  if (!c) {
    const titleText = text.trim() || (currentAttachments[0] ? currentAttachments[0].name : "New chat");
    c = { id: String(Date.now()), title: titleText.slice(0, 48), server: k, messages: [] };
    chats.unshift(c);
    activeId = c.id;
    store.set("activeId_" + k, activeId);
  }

  const userMsg = { role: "user", content: promptText };
  if (images.length) userMsg.images = images;
  if (fileNames.length) userMsg.files = fileNames;

  c.messages.push(userMsg);
  saveCurChats(chats);
  render();

  const body = addMsg("assistant", "");
  body.innerHTML = '<span class="wait">Thinking…</span>';
  scroller.scrollTop = scroller.scrollHeight;

  let reply = "";
  controller = new AbortController();
  setBusy(true);
  try {
    const payload = {
      server: activeServer,
      model: modelEl.value,
      messages: c.messages.map((m) => {
        const item = { role: m.role, content: m.content };
        if (m.images && m.images.length) item.images = m.images;
        return item;
      }),
    };
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
      body: JSON.stringify(payload),
    });
    if (!r.ok) {
      let errText = `Request failed (${r.status}).`;
      try {
        const d = await r.json();
        if (d && d.error) errText = d.error;
      } catch {
        const t = await r.text().catch(() => "");
        if (t) errText = t;
      }
      throw new Error(errText);
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const part = JSON.parse(line);
        if (part.error) throw new Error(part.error);
        reply += part.message?.content || "";
        body.innerHTML = md(reply) || '<span class="wait">Thinking…</span>';
      }
      scroller.scrollTop = scroller.scrollHeight;
    }
    c.messages.push({ role: "assistant", content: reply });
    saveCurChats(chats);
  } catch (e) {
    if (e.name === "AbortError") {
      if (reply) {
        c.messages.push({ role: "assistant", content: reply });
        saveCurChats(chats);
      }
    } else {
      c.messages.pop();
      saveCurChats(chats);
      body.parentElement.className = "msg error";
      body.textContent = e.message + " Check that the server is still reachable, then send again.";
      controller = null;
      setBusy(false);
      return;
    }
  }
  controller = null;
  setBusy(false);
  render();
  input.focus();
}

$("composer").onsubmit = (e) => {
  e.preventDefault();
  if (controller) { controller.abort(); return; }
  const t = input.value.trim();
  if ((!t && !attachedFiles.length) || !connected) return;
  input.value = ""; input.style.height = "auto";
  send(t);
};
input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } };
input.oninput = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; };

render();
if (activeServer) {
  serverEl.value = activeServer;
  connect(true);
}
</script>
</body>
